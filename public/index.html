<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de Deploys · Vercel</title>
  <style>
    :root {
      --bg: #070708;
      --panel: #0e0e11;
      --panel-2: #131317;
      --border: #23232a;
      --text: #f2f2f4;
      --muted: #7c7c86;
      --cyan: #22d3ee;
      --green: #2ee6a6;
      --amber: #f5c451;
      --red: #f76d6d;
      --blue: #6aa8ff;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 30px 22px 60px; }

    header.top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .tri { font-size: 30px; line-height: 1; margin-top: 2px; }
    .brand h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
    .brand h1 .hl { color: var(--cyan); }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .controls { display: flex; align-items: center; gap: 10px; }
    .auto {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(46,230,166,.08); border: 1px solid rgba(46,230,166,.35);
      color: var(--green); padding: 8px 13px; border-radius: 8px; font-size: 13px; font-weight: 600;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,230,166,.5);} 70% { box-shadow: 0 0 0 7px rgba(46,230,166,0);} 100% { box-shadow: 0 0 0 0 rgba(46,230,166,0);} }
    button.refresh {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    button.refresh:hover { border-color: #38384a; }
    button.refresh:disabled { opacity: .55; cursor: default; }
    button.refresh svg { transition: transform .5s; }
    button.refresh.spin svg { transform: rotate(360deg); }

    .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px 20px; }
    .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; line-height: 1.4; font-weight: 600; }
    .kpi .num {
      display: inline-block; margin-top: 16px; font-size: 30px; font-weight: 800; letter-spacing: 0.02em;
      border: 1.5px solid var(--border); border-radius: 10px; padding: 4px 14px; min-width: 34px; text-align: center;
    }
    .kpi.pct .num { font-size: 30px; }
    .kpi .sub { color: var(--muted); font-size: 12px; margin-top: 10px; }
    .n-green { color: var(--green); border-color: rgba(46,230,166,.4); }
    .n-red { color: var(--red); border-color: rgba(247,109,109,.4); }
    .n-amber { color: var(--amber); border-color: rgba(245,196,81,.4); }

    .banner {
      background: rgba(247,109,109,.07); border: 1px solid rgba(247,109,109,.32);
      color: #f4b9b9; padding: 15px 18px; border-radius: var(--radius); margin-bottom: 22px;
      font-size: 13.5px; line-height: 1.6; display: none;
    }
    .banner.show { display: block; }
    .banner .bt { color: var(--red); font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .banner code { background: rgba(255,255,255,.09); padding: 2px 6px; border-radius: 5px; }
    .banner a { color: var(--blue); }
    .banner ol { margin: 10px 0 0; padding-left: 20px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
      text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    tbody td { padding: 14px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: top; }
    tbody tr:hover { background: rgba(255,255,255,.015); }
    .proj { font-weight: 700; }
    .proj a { color: var(--text); text-decoration: none; }
    .proj a:hover { color: var(--cyan); }
    .commit { color: var(--muted); font-size: 12px; margin-top: 3px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .state-pill { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; margin-left: 8px; vertical-align: middle; }
    .s-ready { background: rgba(46,230,166,.14); color: var(--green); }
    .s-error { background: rgba(247,109,109,.14); color: var(--red); }
    .s-building { background: rgba(245,196,81,.14); color: var(--amber); }
    .s-other { background: rgba(124,124,134,.16); color: var(--muted); }
    .branch { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--blue); }
    td a.open { color: var(--blue); text-decoration: none; }
    td a.open:hover { text-decoration: underline; }
    .empty, .skeleton { color: var(--muted); font-size: 13px; padding: 22px 14px; text-align: center; }

    footer { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="tri">▲</div>
        <div>
          <h1>Painel de <span class="hl">Deploys</span></h1>
          <p>Todos os projetos, via API central na Vercel</p>
        </div>
      </div>
      <div class="controls">
        <span class="auto"><span class="dot"></span> auto <b id="countdown">30</b>s</span>
        <button class="refresh" id="refreshBtn" onclick="load(true)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          atualizar
        </button>
      </div>
    </header>

    <div class="grid-kpi">
      <div class="kpi"><div class="label">Deploys<br>(recentes)</div><div class="num" id="k-total">0</div></div>
      <div class="kpi"><div class="label">Prontos</div><div class="num n-green" id="k-ready">0</div></div>
      <div class="kpi"><div class="label">Com erro</div><div class="num n-red" id="k-error">0</div></div>
      <div class="kpi"><div class="label">Em andamento</div><div class="num n-amber" id="k-building">0</div></div>
      <div class="kpi pct"><div class="label">Taxa de sucesso</div><div class="num" id="k-rate">0%</div><div class="sub" id="k-rate-sub">0/0</div></div>
    </div>

    <div class="banner" id="banner"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Projeto / Commit</th><th>Branch</th><th>Autor</th><th>Duração</th><th>Quando</th><th></th></tr>
        </thead>
        <tbody id="rows"><tr><td colspan="6" class="skeleton">carregando deployments…</td></tr></tbody>
      </table>
    </div>

    <footer>
      <span>〰️</span> <span>Fonte: <span id="src">/api/deployments</span> · atualizado <span id="updated">—</span></span>
    </footer>
  </div>

  <script>
    const REFRESH_SECONDS = 30;
    let countdown = REFRESH_SECONDS;

    function stateClass(s) {
      s = (s || '').toUpperCase();
      if (s === 'READY') return 's-ready';
      if (s === 'ERROR') return 's-error';
      if (['BUILDING', 'QUEUED', 'INITIALIZING'].includes(s)) return 's-building';
      return 's-other';
    }
    function isBuilding(s) { return ['BUILDING', 'QUEUED', 'INITIALIZING'].includes((s || '').toUpperCase()); }

    function timeAgo(ts) {
      if (!ts) return '—';
      const m = Math.floor((Date.now() - ts) / 60000);
      if (m < 1) return 'agora';
      if (m < 60) return m + ' min';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h';
      return Math.floor(h / 24) + 'd';
    }
    function fmtDur(sec) {
      if (sec == null) return '—';
      if (sec < 60) return sec + 's';
      const m = Math.floor(sec / 60), s = sec % 60;
      return m + 'm' + (s ? ' ' + s + 's' : '');
    }
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function showBanner(msg, needsToken) {
      const b = document.getElementById('banner');
      b.classList.add('show');
      b.innerHTML = `
        <div class="bt">⚠️ Não foi possível carregar</div>
        <div style="margin-top:6px">${esc(msg)}</div>` +
        (needsToken ? `<ol>
            <li>Crie um token em <a href="https://vercel.com/account/tokens" target="_blank" rel="noopener">vercel.com/account/tokens</a></li>
            <li>No projeto: <b>Settings → Environment Variables</b> → adicione <code>VERCEL_TOKEN</code></li>
            <li>Marque Production, Preview e Development e faça <b>Redeploy</b></li>
          </ol>` : '');
    }
    function hideBanner() { document.getElementById('banner').classList.remove('show'); }

    async function load(manual) {
      const btn = document.getElementById('refreshBtn');
      if (manual) { btn.disabled = true; btn.classList.add('spin'); }
      try {
        const res = await fetch('/api/deployments?limit=50', { cache: 'no-store' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const e = new Error(data.error || ('HTTP ' + res.status));
          e.code = data.code; throw e;
        }
        const deps = data.deployments || [];

        let ready = 0, error = 0, building = 0;
        for (const d of deps) {
          const s = (d.state || '').toUpperCase();
          if (s === 'READY') ready++;
          else if (s === 'ERROR') error++;
          else if (isBuilding(s)) building++;
        }
        const finished = ready + error;
        const rate = finished ? Math.round((ready / finished) * 100) : 0;

        document.getElementById('k-total').textContent = deps.length;
        document.getElementById('k-ready').textContent = ready;
        document.getElementById('k-error').textContent = error;
        document.getElementById('k-building').textContent = building;
        document.getElementById('k-rate').textContent = rate + '%';
        document.getElementById('k-rate-sub').textContent = ready + '/' + finished;

        const tb = document.getElementById('rows');
        tb.innerHTML = deps.length ? deps.map((d) => `
          <tr>
            <td>
              <div class="proj">${d.url ? `<a href="https://${esc(d.url)}" target="_blank" rel="noopener">${esc(d.name)}</a>` : esc(d.name)}<span class="state-pill ${stateClass(d.state)}">${esc(d.state)}</span></div>
              <div class="commit" title="${esc(d.commitMessage || '')}">${esc(d.commitMessage || '—')}</div>
            </td>
            <td><span class="branch">${esc(d.branch || '—')}</span></td>
            <td>${esc(d.creator || '—')}</td>
            <td>${fmtDur(d.buildSeconds)}</td>
            <td>${timeAgo(d.created)}</td>
            <td>${d.url ? `<a class="open" href="https://${esc(d.url)}" target="_blank" rel="noopener">abrir ↗</a>` : ''}</td>
          </tr>`).join('') : '<tr><td colspan="6" class="empty">nenhum deployment encontrado</td></tr>';

        hideBanner();
        document.getElementById('updated').textContent = new Date().toLocaleTimeString('pt-BR');
      } catch (e) {
        showBanner(
          e.code === 'NO_TOKEN'
            ? e.message
            : 'Failed to fetch — confira se /api/deployments está no ar e se o token (VERCEL_TOKEN) foi configurado lá.',
          e.code === 'NO_TOKEN'
        );
      } finally {
        if (manual) { btn.disabled = false; setTimeout(() => btn.classList.remove('spin'), 500); }
        countdown = REFRESH_SECONDS;
      }
    }

    function tick() {
      countdown--;
      document.getElementById('countdown').textContent = Math.max(countdown, 0);
      if (countdown <= 0) { countdown = REFRESH_SECONDS; load(false); }
    }

    load(false);
    setInterval(tick, 1000);
  </script>
</body>
</html>
